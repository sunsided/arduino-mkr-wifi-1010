# The Arduino MKR-WIFI-1010 is an ATSAMD21G18A-U
# SAMD21 is a Cortex-M0 and hence thumbv6m
# See https://probe.rs/targets/master/ATSAMD21G18A

[build]
target-dir = "target"
target = "thumbv6m-none-eabi"

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# runner = 'gdb-multiarch -q -x multiarch.gdb'
runner = 'probe-rs run --chip ATSAMD21G18AU'
linker = "arm-none-eabi-ld"
rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tdefmt.x",
]

[profile.dev]
opt-level = "s"

[profile.release]
debug = 2
opt-level = "z"
lto = true
